<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>结构化公文编辑器（多模板多样式）</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <style>
    body { font-family: "Microsoft Yahei", sans-serif; background: #eef2f5; padding: 20px; }
    h1 { text-align: center; color: #2c3e50; }
    #container { display: flex; max-width: 1200px; margin: 20px auto; gap: 20px; }
    #formPanel, #previewPanel {
      flex: 1; background: #fff; padding: 20px;
      border-radius: 8px; border: 1px solid #ccc;
    }
    .field-group { margin-bottom: 12px; }
    .field-group label { display: block; font-weight: bold; margin-bottom: 4px; }
    .field-group input, .field-group textarea, .field-group select {
      width: 100%; padding: 6px; font-size: 14px;
    }
    .button-group button {
      margin: 5px 5px 10px 0; padding: 6px 12px; cursor: pointer;
    }
    .button-group button.active {
      background: #3498db; color: white;
    }
    .export-btn {
      margin-right: 10px; padding: 8px 14px;
      background: #3498db; color: white;
      border: none; cursor: pointer; border-radius: 4px;
    }
    .export-btn:hover { background: #2980b9; }
    .card { border: 1px solid #aaa; border-radius: 6px; padding: 20px; margin-bottom: 20px; }
    .style-blue .card { background: #f0f4fa; border-color: #2c3e50; color: #2c3e50; }
    .style-green .card { background: #eaf7ee; border-color: #2c7634; color: #2c7634; }
    .style-red .card { background: #f9eaea; border-color: #c0392b; color: #c0392b; }
  </style>
</head>
<body>
  <h1>结构化公文编辑器（多模板多样式）</h1>
  <div id="container">
    <div id="formPanel">
      <div class="field-group">
        <label>公文类别：</label>
        <select id="categorySelect"></select>
      </div>
      <div class="field-group">
        <label>配色风格：</label>
        <div class="button-group" id="styleButtons"></div>
      </div>
      <div class="field-group">
        <label>布局样式：</label>
        <div class="button-group" id="layoutButtons"></div>
      </div>
      <div id="fieldsContainer"></div>
      <div style="margin-top: 10px">
        <button class="export-btn" onclick="exportTxt()">导出TXT</button>
        <button class="export-btn" onclick="exportDoc()">导出DOC</button>
        <button class="export-btn" onclick="exportPDF()">导出PDF</button>
      </div>
    </div>
    <div id="previewPanel">
      <div id="previewArea"></div>
    </div>
  </div>

<script>
const styles = ['style-blue', 'style-green', 'style-red'];
let currentStyle = styles[0];
let currentCategory = '通知';
let currentLayout = 0;
const fieldValues = {};

function $(id) { return document.getElementById(id); }

function initEditor() {
  for (let cat in templates) {
    $('categorySelect').appendChild(new Option(cat, cat));
  }
  $('categorySelect').onchange = () => {
    currentCategory = $('categorySelect').value;
    currentLayout = 0;
    buildForm();
    updateLayoutButtons();
    render();
  };

  styles.forEach(st => {
    const btn = document.createElement('button');
    btn.textContent = st.replace('style-', '').toUpperCase();
    btn.onclick = () => {
      currentStyle = st;
      updateStyleButtons();
      render();
    };
    $('styleButtons').appendChild(btn);
  });

  updateStyleButtons();
  buildForm();
  updateLayoutButtons();
  render();
}

function updateStyleButtons() {
  Array.from($('styleButtons').children).forEach(btn => {
    btn.classList.toggle('active', `style-${btn.textContent.toLowerCase()}` === currentStyle);
  });
}

function updateLayoutButtons() {
  const layouts = templates[currentCategory].layouts;
  const container = $('layoutButtons');
  container.innerHTML = '';
  layouts.forEach((lay, idx) => {
    const btn = document.createElement('button');
    btn.textContent = lay.name;
    btn.className = idx === currentLayout ? 'active' : '';
    btn.onclick = () => {
      currentLayout = idx;
      updateLayoutButtons();
      render();
    };
    container.appendChild(btn);
  });
}

function buildForm() {
  $('fieldsContainer').innerHTML = '';
  const fields = templates[currentCategory].fields;
  const defaults = templates[currentCategory].defaults;

  fields.forEach(f => {
    fieldValues[f] = defaults[f] || '';
    const div = document.createElement('div');
    div.className = 'field-group';
    div.innerHTML = `<label>${f}：</label>` +
      (f === 'body' ? `<textarea id="${f}" rows="4">${fieldValues[f]}</textarea>`
                    : `<input id="${f}" value="${fieldValues[f]}">`);
    $('fieldsContainer').appendChild(div);
    document.getElementById(f).oninput = (e) => {
      fieldValues[f] = e.target.value;
      render();
    };
  });
}

function render() {
  const layout = templates[currentCategory].layouts[currentLayout];
  const html = layout.render(fieldValues);
  $('previewArea').className = currentStyle;
  $('previewArea').innerHTML = html;
}

function exportTxt() {
  const text = $('previewArea').innerText;
  const blob = new Blob([text], { type: "text/plain" });
  download(blob, "文档.txt");
}
function exportDoc() {
  const html = `<html><meta charset="utf-8"><body>${$('previewArea').innerHTML}</body></html>`;
  const blob = new Blob([html], { type: "application/msword" });
  download(blob, "文档.doc");
}
async function exportPDF() {
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF('p', 'pt', 'a4');
  const scale = 2;
  const element = document.getElementById("previewArea");

  const canvas = await html2canvas(element, {
    scale: scale,
    useCORS: true
  });

  const imgData = canvas.toDataURL("image/png");
  const imgProps = doc.getImageProperties(imgData);
  const pdfWidth = doc.internal.pageSize.getWidth();
  const pdfHeight = (imgProps.height * pdfWidth) / imgProps.width;

  doc.addImage(imgData, 'PNG', 0, 0, pdfWidth, pdfHeight);
  doc.save("文档.pdf");
}
function download(blob, filename) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  a.click();
}

const templates = {
  通知: {
    fields: ['title','unit','date','body'],
    defaults: {
      title: '关于开展培训的通知',
      unit: '综合办',
      date: '2025年7月',
      body: '为提升员工素质，计划于8月1日开展集中培训，请准时参加。'
    },
    layouts: [
      {
        name: '简洁通知',
        render: v => `<div class="card"><h2>${v.title}</h2><p><strong>单位：</strong>${v.unit}</p><p><strong>时间：</strong>${v.date}</p><hr><p>${v.body}</p></div>`
      },
      {
        name: '居中横栏通知',
        render: v => `<div class="card" style="text-align:center"><h2>${v.title}</h2><p>${v.unit} ｜ ${v.date}</p><div style="margin-top:20px;text-align:left">${v.body}</div></div>`
      }
    ]
  },
  会议纪要: {
    fields: ['title','time','location','body'],
    defaults: {
      title: '部门例会纪要',
      time: '2025-07-01',
      location: '会议室A',
      body: '讨论了项目进展与下周计划。'
    },
    layouts: [
      {
        name: '卡片纪要',
        render: v => `<div class="card"><h2>${v.title}</h2><p><strong>时间：</strong>${v.time}</p><p><strong>地点：</strong>${v.location}</p><hr><p>${v.body}</p></div>`
      },
      {
        name: '横栏纪要',
        render: v => `<div class="card"><div style="display:flex;justify-content:space-between"><span>${v.time}</span><span>${v.location}</span></div><h2>${v.title}</h2><p>${v.body}</p></div>`
      }
    ]
  },
  请示: {
    fields: ['title','recipient','date','body'],
    defaults: {
      title: '关于申请市场宣传经费的请示',
      recipient: '领导',
      date: '2025年7月',
      body: '为推进宣传，预计支出3万元，请审批。'
    },
    layouts: [
      {
        name: '请示正文',
        render: v => `<div class="card"><h2>${v.title}</h2><p>致：${v.recipient}</p><p><strong>日期：</strong>${v.date}</p><hr><p>${v.body}</p></div>`
      },
      {
        name: '标题分栏',
        render: v => `<div class="card"><div style="display:flex;justify-content:space-between"><strong>${v.recipient}</strong><span>${v.date}</span></div><h2>${v.title}</h2><p>${v.body}</p></div>`
      }
    ]
  },
  工作报告: {
    fields: ['title','department','period','body'],
    defaults: {
      title: '第一季度工作报告',
      department: '研发部',
      period: '2025-Q1',
      body: '本季度完成3个重点项目，开发效率提升20%。'
    },
    layouts: [
      {
        name: '模块式报告',
        render: v => `<div class="card"><h2>${v.title}</h2><p><strong>部门：</strong>${v.department}</p><p><strong>季度：</strong>${v.period}</p><hr><p>${v.body}</p></div>`
      },
      {
        name: '标题加标签',
        render: v => `<div class="card"><h2>${v.title}【${v.period}】</h2><p><em>部门：${v.department}</em></p><p>${v.body}</p></div>`
      }
    ]
  },
  工作总结: {
    fields: ['title','year','body'],
    defaults: {
      title: '2025年度工作总结',
      year: '2025',
      body: '全年实现营业额增长18%，团队稳定发展。'
    },
    layouts: [
      {
        name: '普通总结',
        render: v => `<div class="card"><h2>${v.title}</h2><p><strong>年度：</strong>${v.year}</p><hr><p>${v.body}</p></div>`
      },
      {
        name: '标签式总结',
        render: v => `<div class="card"><h2>${v.title}</h2><p style="color:#888">总结时间：${v.year}</p><p>${v.body}</p></div>`
      }
    ]
  }
};

document.addEventListener("DOMContentLoaded", initEditor);
</script>
</body>
</html>
